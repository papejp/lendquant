name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --cov=lendquant --cov-report=term-missing

  no-sas-artifacts:
    # Mirror of the sibling repo's guard — lendquant must NEVER contain
    # SAS source, SAS data, or *_source_original.py translations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on SAS lineage
        run: |
          set -eu
          BAD=$(git ls-files \
            | grep -E '(\.sas$|\.sas7bdat$|source_original.*\.py$)' \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::SAS-lineage files found:"
            echo "$BAD"
            exit 1
          fi
          echo "OK — no SAS-lineage artifacts."
